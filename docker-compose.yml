# LOCAL DEVELOPMENT ONLY.
# Credentials below are throwaway defaults for a local Docker Postgres. They are overridable via a
# local .env file (see .env.example). Never reuse them in any shared, staging or production environment.
name: trustchain-commerce

services:
  postgres:
    image: postgres:16-alpine
    container_name: tc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trustchain}          # dev-only default
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustchain}  # dev-only default
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trustchain} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Present for later phases. No service produces or consumes Kafka messages in Phase 1.
  kafka:
    image: apache/kafka:3.8.0
    container_name: tc-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: tc-order-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orderdb
      DB_USER: ${POSTGRES_USER:-trustchain}          # dev-only default
      DB_PASSWORD: ${POSTGRES_PASSWORD:-trustchain}  # dev-only default
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: tc-inventory-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventorydb
      DB_USER: ${POSTGRES_USER:-trustchain}          # dev-only default
      DB_PASSWORD: ${POSTGRES_PASSWORD:-trustchain}  # dev-only default
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
